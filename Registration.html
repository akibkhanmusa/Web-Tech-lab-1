<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Registration page</h1>
    <form action="login.html" method="get">

        <label for="name">Name:</label>
        <input type="text" name="fullname" id="name" placeholder="enter your name" required><br><br>


        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="you@example.com" required><br><br>

        <label for="password">Password:</label>
        <input type="password" name="pass" id="password" placeholder="enter password" required><br><br>

        <label>Date of birth:</label>
        <input type="Date" name="dob"><br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Clear">


    </form>
</body>



</html>
