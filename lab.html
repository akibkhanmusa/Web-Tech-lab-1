<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Student Registration Form</h1>
    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" placeholder="write your name" required> <br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter your pass" required>
        <br><br>


        <label for="age">Age:</label>
        <input type="number" name="age" min="1" max="100" required>
        <br><br>

        <label>Date of birth: </label>
        <input type="date" name="dob"><br><br>

        <label>City:</label>
        <select name="city">
            <option value="dhaka">Dhaka</option>
            <option value="khulna">Khulna</option>
            <option value="rajshahi">Rajshahi</option>
            <option value="sylhet">Sylhet</option>
        </select> <br><br>

        Gender:

        <input type="radio" name="Gender" value="Male">Male
        <input type="radio" name="Gender" value="Female">Female<br><br>


        <p>Hobbies:</p>
        <input tppe="checkbox" name="hobby" value="reading">Reading<br><br>
        <input tppe="checkbox" name="hobby" value="cricket">Cricket<br><br>
        <input tppe="checkbox" name="hobby" value="music">Music<br><br>


        <label>About Yourself:</label><br>
        <textarea name="about" rows="5" cols="40" placeholder="Write a few lines about yourself"></textarea>
        <br><br>


        <input type="submit" value="Register">
        <input type="reset" value="Clear">







    </form>
</body>

</html>
